# JobHunt Slack app manifest.
#
# Paste this at https://api.slack.com/apps/new -> "From a manifest" -> YAML.
# It pre-configures Socket Mode, interactivity, the bot user, the slash
# command and every scope the app needs, so there is nothing left to tick.
#
# Socket Mode is why there are no request URLs here: the app opens an outbound
# WebSocket to Slack, so it needs no public endpoint. That is what lets it run
# on the Pi behind home NAT.

display_information:
  name: JobHunt
  description: Daily job matches, CV and cover letter generation, application tracking
  background_color: "#1b4f8a"
  long_description: >-
    Fetches job postings every few hours from the Bundesagentur für Arbeit,
    Arbeitnow and company career boards, scores each one against your profile,
    and posts the good matches here as interactive cards. From a card you can
    generate a tailored CV or cover letter as a Word document, shortlist the
    role, or mark it applied. A daily report summarises new matches, pending
    applications and overdue follow-ups.

features:
  bot_user:
    display_name: JobHunt
    always_online: false
  slash_commands:
    - command: /jobhunt
      description: Manage job titles, trigger a fetch, or check pipeline status
      usage_hint: titles | run | status | top
      should_escape: false

oauth_config:
  scopes:
    bot:
      # Post job cards and the daily report.
      - chat:write
      # Post into a public channel the bot has not been invited to.
      - chat:write.public
      # Upload generated CVs and cover letters into a card's thread.
      - files:write
      # Register the /jobhunt slash command.
      - commands
      # Resolve the target channel by name.
      - channels:read
      - groups:read
      # Resolve your user ID for the action allowlist.
      - users:read

settings:
  # No request_url needed: Socket Mode carries interactions over the WebSocket.
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
